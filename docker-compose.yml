version: '3.8'

services:
  jekyll:
    build: .
    ports:
      - "4100:4000"    # Host 4100 avoids NoMachine's default TCP 4000
      - "35729:35729"  # LiveReload
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling

volumes:
  bundle_cache:
